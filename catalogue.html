<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — TechStore Burkina</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site">
    <div class="wrap">
        <a class="brand" href="index.html">
            <img class="mark-logo" src="https://drive.google.com/thumbnail?id=1hEJ1H8CitZmhwNdnBL6qHXafMuxLKHJH&sz=w100" alt="Logo">
            <span>TechStore</span>
        </a>
        <nav class="main">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="catalogue.html" class="active">Catalogue</a></li>
                <li><a class="btn btn-whatsapp btn-sm" href="https://wa.me/22676963696">💬 WhatsApp</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section style="padding-bottom: 20px;">
        <div class="wrap">
            <span class="kicker">Inventaire</span>
            <h1>Catalogue Officiel</h1>
            <p style="max-width: 600px; color: var(--ink-soft);">Découvrez nos solutions technologiques. Chaque produit est sélectionné pour sa fiabilité et ses performances.</p>

            <div class="filters" id="filters"></div>

            <div class="search-bar" style="margin-top: 30px; position: relative;">
                <input type="text" id="search-input" placeholder="Rechercher un modèle, une marque..."
                    style="width: 100%; max-width: 600px; padding: 18px 24px; border-radius: 16px; border: 1px solid var(--line); font-size: 16px; outline: none; background: #fff;">
                <span id="result-count" style="display: block; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase;"></span>
            </div>
        </div>
    </section>

    <div class="wrap">
        <div class="product-grid" id="product-grid">
            <!-- Dynamique via Supabase -->
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/script.js"></script>
</body>
</html>
